name: Release & Publish AIAPIConverter

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.1）。留空则使用 gradle.properties 的 version'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Maven repository
        uses: actions/checkout@v4
        with:
          repository: WilliamGao1130/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven-repo
          ref: main

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" =~ ^v[0-9] ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$(grep '^version=' gradle.properties | cut -d= -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven repository
        run: |
          ./gradlew publish \
            -PmavenRepoDir="$GITHUB_WORKSPACE/maven-repo" \
            -Pversion="${{ steps.ver.outputs.version }}" \
            --no-daemon --stacktrace

      - name: Build fat jar for release
        run: ./gradlew fatJar -Pversion="${{ steps.ver.outputs.version }}" --no-daemon

      - name: Commit and push Maven repository
        run: |
          cd "$GITHUB_WORKSPACE/maven-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "publish AIAPIConverter ${{ steps.ver.outputs.version }}"
            git push origin main
          fi

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AIAPIConverter ${{ steps.ver.outputs.version }}
          body: |
            AIAPIConverter ${{ steps.ver.outputs.version }}

            - `AIAPIConverter-${{ steps.ver.outputs.version }}-all.jar`：可执行 fat jar（`java -jar` 直接运行网关）
            - Maven 坐标：`org.bluepowerrobotics:AIAPIConverter:${{ steps.ver.outputs.version }}`
          files: |
            build/libs/AIAPIConverter-${{ steps.ver.outputs.version }}-all.jar
            build/libs/AIAPIConverter-${{ steps.ver.outputs.version }}.jar
            build/libs/AIAPIConverter-${{ steps.ver.outputs.version }}-sources.jar
